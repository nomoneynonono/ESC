<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cat Bug Catcher</title>
  
  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: 'DM Sans', sans-serif; overflow: hidden; touch-action: manipulation; }
    .creature {
      position: absolute; cursor: pointer; transition: transform 0.1s;
      z-index: 10; will-change: transform, left, top;
    }
    .creature:active { transform: scale(0.7); }
    .creature.caught { animation: poof 0.3s forwards; }
    @keyframes poof { to { transform: scale(2); opacity: 0; } }
    .digit-slot {
      width: 52px; height: 64px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900;
    }
    .prompt-bounce { animation: bounce 1s infinite; }
    @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 25%{ transform: translateX(-4px); } 75%{ transform: translateX(4px); } }
  </style>
</head>
<body class="w-full" style="min-height: 100vh; background: linear-gradient(135deg, rgb(26, 26, 46), rgb(22, 33, 62));">
  <div id="arena" class="absolute inset-0 z-10 pointer-events-none"></div>
  
  <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-4 py-3">
    <h1 class="text-2xl font-black" style="color: rgb(251, 191, 36); font-weight: 900; font-size: 28px;">🐱 จับแมลง!</h1>
    <div class="flex items-center gap-3">
      <div class="px-3 py-1 rounded-full text-lg font-bold" style="background: rgb(49, 46, 129); color: rgb(251, 191, 36);">
        🐻 <span id="score-num">0</span>
      </div>
      <button class="px-3 py-2 rounded-lg font-bold text-sm" onclick="cycleSpeed()" style="pointer-events: auto; background: rgb(124, 45, 18); color: rgb(254, 215, 170); font-size: 20px;">⚡ 100%</button>
      <button class="px-3 py-2 rounded-lg font-bold text-sm" onclick="toggleFS()" style="pointer-events: auto; background: rgb(76, 29, 149); color: rgb(233, 213, 255); font-size: 20px;">⛶ เต็มจอ</button>
    </div>
  </header>

  <div class="absolute top-0 left-0 right-0 z-20 flex flex-col items-center mt-2 pt-20">
    <div class="text-base mb-1" style="color: rgb(165, 180, 252); font-weight: 700; font-size: 20px;">จับตัวนี้ให้ได้!</div>
    <div id="prompt-display" class="prompt-bounce text-5xl mb-3"></div>
    <div id="digits" class="flex gap-2 mb-2"></div>
  </div>

  <div id="result-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/70">
    <div class="text-center">
      <p class="text-3xl font-black mb-4" style="color: rgb(251, 191, 36); font-weight: 700; font-size: 20px;">🎉 ได้เลขแล้ว!</p>
      <div id="final-number" class="text-6xl font-black text-yellow-300 tracking-widest mb-6"></div>
      <button class="px-6 py-3 rounded-xl text-xl font-bold" onclick="resetGame()" style="background: rgb(251, 191, 36); color: rgb(26, 26, 46);">🐱 เล่นอีก!</button>
    </div>
  </div>

  <script>
    const CREATURES = [
        { id:'rat', emoji:'🐀', name:'หนู', group:'rat' },
        { id:'mouse', emoji:'🐁', name:'หนู', group:'rat' },
        { id:'fish', emoji:'🐟', name:'ปลา', group:'fish' },
        { id:'fish2', emoji:'🐠', name:'ปลา', group:'fish' },
        { id:'croc', emoji:'🐊', name:'จิ้งจก' },
        { id:'lizard', emoji:'🦎', name:'กิ้งก่า' }
    ];

    let digits = [];
    let score = 0;
    let target = null;
    let activeCreatures = [];
    let spawnTimer = null;
    let speedMultiplier = 1.0;
    const speedLevels = [0.5, 1.0, 1.5, 2.0];

    function init() {
        digits = [];
        score = 0;
        document.getElementById('score-num').textContent = '0';
        document.getElementById('result-overlay').classList.add('hidden');
        renderDigits();
        pickTarget();
        startSpawning();
    }

    function renderDigits() {
        const c = document.getElementById('digits');
        c.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const d = document.createElement('div');
            d.className = 'digit-slot';
            d.style.background = digits[i] !== undefined ? '#fbbf24' : 'rgba(255,255,255,0.15)';
            d.style.color = digits[i] !== undefined ? '#1a1a2e' : 'rgba(255,255,255,0.3)';
            d.textContent = digits[i] !== undefined ? digits[i] : '?';
            c.appendChild(d);
        }
    }

    function pickTarget() {
        target = CREATURES[Math.floor(Math.random() * CREATURES.length)];
        document.getElementById('prompt-display').textContent = target.emoji;
    }

    function startSpawning() {
        if (spawnTimer) clearInterval(spawnTimer);
        spawnTimer = setInterval(() => {
            if (digits.length >= 6) return;
            const aliveCount = activeCreatures.filter(c => c.alive).length;
            let canSpawn = false;
            if (aliveCount === 0) canSpawn = true;
            else if (aliveCount === 1) canSpawn = true;
            if (canSpawn) spawnCreature();
        }, 800);
        spawnCreature();
    }

    function spawnCreature() {
        if (digits.length >= 6) return;
        const arena = document.getElementById('arena');
        
        const onScreenGroups = activeCreatures.map(ac => ac.group);
        let available = CREATURES.filter(cr => {
            const group = cr.group || cr.id;
            return !onScreenGroups.includes(group);
        });
        if (available.length === 0) available = CREATURES;
        
        const c = available[Math.floor(Math.random() * available.length)];
        const el = document.createElement('div');
        el.className = 'creature';
        
        const size = Math.random() < 0.5 ? 96 : 192;
        el.style.fontSize = size + 'px';
        el.textContent = c.emoji;
        el.dataset.type = c.id;
        el.dataset.group = c.group || c.id;
        el.style.pointerEvents = 'auto';

        const edge = Math.floor(Math.random() * 4);
        const vw = window.innerWidth, vh = window.innerHeight;
        let x, y, dx, dy;
        const isFast = Math.random() < 0.5;
        const baseSpeed = isFast ? (2.0 + Math.random() * 0.5) : (1.0 + Math.random() * 0.5);
        const speed = baseSpeed * speedMultiplier;
        
        if (edge === 0) { x = -50; y = Math.random() * vh * 0.7 + vh * 0.15; dx = speed; dy = (Math.random() - 0.5) * speed; }
        else if (edge === 1) { x = vw + 10; y = Math.random() * vh * 0.7 + vh * 0.15; dx = -speed; dy = (Math.random() - 0.5) * speed; }
        else if (edge === 2) { x = Math.random() * vw * 0.8 + vw * 0.1; y = -50; dx = (Math.random() - 0.5) * speed; dy = speed; }
        else { x = Math.random() * vw * 0.8 + vw * 0.1; y = vh + 10; dx = (Math.random() - 0.5) * speed; dy = -speed; }

        el.style.left = x + 'px';
        el.style.top = y + 'px';
        arena.appendChild(el);

        const obj = { el, x, y, dx, dy, state: 'run', stateTimer: 0, pauseDur: 0, alive: true, life: 0, group: c.group || c.id };
        let alive = true;

        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!alive) return;
            const targetMatch = target.group ? (c.group === target.group) : (c.id === target.id);
            alive = false;
            obj.alive = false;
            el.classList.add('caught');
            setTimeout(() => el.remove(), 300);
            if (targetMatch) {
                addDigit();
            } else {
                addScore();
            }
        });

        activeCreatures.push(obj);
    }

    function addScore() {
        score++;
        document.getElementById('score-num').textContent = score;
    }

    function addDigit() {
        const d = Math.floor(Math.random() * 10);
        digits.push(d);
        addScore();
        renderDigits();
        if (digits.length >= 6) {
            endGame();
        } else {
            pickTarget();
        }
    }

    function endGame() {
        clearInterval(spawnTimer);
        document.getElementById('final-number').textContent = digits.join('');
        document.getElementById('result-overlay').classList.remove('hidden');
        activeCreatures.forEach(c => c.el.remove());
        activeCreatures = [];
    }

    function resetGame() { init(); }

    function tick() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const buttonZone = { x: vw - 80, y: 0, w: 80, h: 50 };
        
        for (let i = activeCreatures.length - 1; i >= 0; i--) {
            const c = activeCreatures[i];
            if (!c.alive) { activeCreatures.splice(i, 1); continue; }
            c.life++;
            c.stateTimer++;

            if (c.state === 'run') {
                c.x += c.dx;
                c.y += c.dy;
                if (Math.random() < 0.02) { c.dx += (Math.random() - 0.5) * 0.5; c.dy += (Math.random() - 0.5) * 0.5; }
                if (c.stateTimer > 60 && Math.random() < 0.01) {
                    c.state = 'pause'; c.stateTimer = 0; c.pauseDur = 30 + Math.random() * 60;
                }
            } else if (c.state === 'pause') {
                if (c.stateTimer > c.pauseDur) { c.state = 'run'; c.stateTimer = 0; }
            }

            c.el.style.left = c.x + 'px';
            c.el.style.top = c.y + 'px';
            c.el.style.transform = c.dx < 0 ? 'scaleX(-1)' : 'scaleX(1)';

            if (c.x > buttonZone.x - 50 && c.x < buttonZone.x + buttonZone.w && 
                c.y > buttonZone.y && c.y < buttonZone.h + 50) {
                if (c.dx > 0) c.dx = -Math.abs(c.dx) * 1.5;
            }

            const margin = 100;
            if (c.x < -margin || c.x > vw + margin || c.y < -margin || c.y > vh + margin) {
                c.alive = false;
            }
        }
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function toggleFS() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
            document.exitFullscreen?.().catch(() => {});
        }
    }

    function cycleSpeed() {
        const currentIndex = speedLevels.indexOf(speedMultiplier);
        const nextIndex = (currentIndex + 1) % speedLevels.length;
        speedMultiplier = speedLevels[nextIndex];
        
        const btn = document.querySelector('button[onclick="cycleSpeed()"]');
        const speedPercent = Math.round(speedMultiplier * 100);
        btn.textContent = `⚡ ${speedPercent}%`;
    }

    init();
  </script>
</body>
</html>
